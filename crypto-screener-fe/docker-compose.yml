# =============================================================================
# Crypto Screener FE — Docker Compose
# =============================================================================
# Usage:
#   Development (hot-reload):
#     docker compose up dev
#
#   Production build:
#     docker compose up app
#
#   Override env at runtime (without rebuilding):
#     NEXT_PUBLIC_API_BASE_URL=https://api.example.com docker compose up app
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # app — production image (standalone Next.js server)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the bundle at build time.
        # Change these and rebuild when pointing at a different backend.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
        NEXT_PUBLIC_USE_MOCK_DATA: ${NEXT_PUBLIC_USE_MOCK_DATA:-false}
    image: crypto-screener-fe:latest
    container_name: crypto-screener-fe
    restart: unless-stopped
    ports:
      - "${FE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    # Uncomment to connect to the backend on the same Docker network:
    # networks:
    #   - crypto-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # dev — development server with source mounted (hot-reload)
  # ---------------------------------------------------------------------------
  dev:
    image: node:20-alpine
    container_name: crypto-screener-fe-dev
    working_dir: /app
    volumes:
      # Mount source — changes are reflected immediately
      - .:/app
      # Isolate node_modules inside the container so host OS binaries
      # (Windows DLLs, etc.) don't conflict with Alpine binaries
      - /app/node_modules
    ports:
      - "${FE_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
      NEXT_PUBLIC_USE_MOCK_DATA: ${NEXT_PUBLIC_USE_MOCK_DATA:-true}
    command: sh -c "npm install && npm run dev"
    # Uncomment to connect to the backend on the same Docker network:
    # networks:
    #   - crypto-net

# ---------------------------------------------------------------------------
# Shared network — uncomment when running alongside the backend container
# ---------------------------------------------------------------------------
# networks:
#   crypto-net:
#     external: true   # created by the backend's docker-compose
#     # or:
#     # driver: bridge
